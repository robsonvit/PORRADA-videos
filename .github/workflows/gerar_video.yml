name: 🎬 Gerar Vídeo PORRADA

on:
  # ── Disparo manual com parâmetros ─────────────────────────────────────────
  workflow_dispatch:
    inputs:
      num_videos:
        description: 'Quantos vídeos gerar (1 a 10)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '5'
          - '10'

  # ── Agendamento automático diário ─────────────────────────────────────────
  # Roda todo dia às 12:00 UTC (09:00 Brasília)
  schedule:
    - cron: '0 12 * * *'

# ── Permissões para commit do temas_usados.json ───────────────────────────────
permissions:
  contents: write

jobs:
  gerar-video:
    name: 🎬 Pipeline de Vídeo PORRADA
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout do repositório ────────────────────────────────────────
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Setup Python ───────────────────────────────────────────────────
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Instala FFmpeg e fontes ────────────────────────────────────────
      - name: 🎬 Instalar FFmpeg e fontes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fontconfig

          # Cria diretório para a fonte Anton
          sudo mkdir -p /usr/share/fonts/truetype/anton

          # Baixa a fonte Anton (similar ao Impact — perfeita para legendas)
          echo "⬇️ Baixando fonte Anton..."
          wget -q -O /tmp/Anton-Regular.ttf \
            "https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf"
          sudo cp /tmp/Anton-Regular.ttf /usr/share/fonts/truetype/anton/

          # Atualiza cache de fontes
          sudo fc-cache -f -v > /dev/null 2>&1

          # Verifica instalação
          echo "✅ FFmpeg version:"
          ffmpeg -version | head -1
          echo "✅ Fontes disponíveis (Anton):"
          fc-list | grep -i anton || echo "Fonte Anton não encontrada no cache"

      # ── 4. Instala dependências Python ────────────────────────────────────
      - name: 📦 Instalar dependências Python
        run: |
          pip install --upgrade pip -q
          pip install -r requirements.txt -q
          echo "✅ Dependências instaladas"

      # ── 5. Executa o pipeline de criação de vídeo ─────────────────────────
      - name: 🚀 Executar pipeline de vídeo
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          NUM_VIDEOS="${{ github.event.inputs.num_videos || '1' }}"
          echo "🎬 Gerando $NUM_VIDEOS vídeo(s)..."
          python scripts/pipeline.py "$NUM_VIDEOS"

      # ── 6. Commit do temas_usados.json atualizado ─────────────────────────
      - name: 💾 Salvar temas usados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add temas_usados.json
          git diff --cached --quiet && echo "Sem mudanças para commitar" || \
            git commit -m "🔄 Atualiza temas usados [skip ci]"
          git push || echo "Push falhou (pode ser que não haja mudanças)"

      # ── 7. Upload do vídeo gerado como artefato (backup) ──────────────────
      - name: 📤 Upload vídeo como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-porrada-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 7
          if-no-files-found: warn
